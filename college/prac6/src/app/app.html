<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="mDiv">
    <h3 class="count">{{count}}</h3>
    <div class="bDiv">
      <button (click)="handleCounter('minus')" class="btn Dec">Decrement</button>
      <button (click)="handleCounter('reset')" class="btn Res">reset</button>
      <button (click)="handleCounter('plus')" class="btn Inc">increament</button>
    </div>
  </div>
</body>

</html>
